<!doctype html>
<html lang="en" id="main-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mofulyen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-500 min-h-screen flex flex-col">

  <header class="w-full h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-6 shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg shadow-lg"></div>
      <span class="font-bold text-xl text-slate-800 dark:text-white">Mofulyen Dashboard</span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 bg-slate-800 text-white flex flex-col p-5 shrink-0 sticky top-0 h-screen">
      <h2 class="text-2xl font-bold mb-10 text-indigo-400 font-serif">My App</h2>
      <nav class="space-y-4 flex-1">
        <a href="index.html" class="block p-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition text-center shadow-md">Dashboard</a>
        <a href="projects.html" class="block p-3 rounded-lg hover:bg-slate-700 transition text-center">Projects</a>
        <a href="team.html" class="block p-3 rounded-lg hover:bg-slate-700 transition text-center">Team</a>
        <a href="setting.html" class="block p-3 rounded-lg hover:bg-slate-700 transition text-center">Settings</a>
      </nav>
      <div class="mt-auto border-t border-slate-700 pt-5 text-center">
        <p class="text-sm text-slate-400">Logged in as: <br><strong class="text-white">Mofulyen</strong></p>
      </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        <div class="bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-200 dark:border-slate-700 transition-transform hover:scale-[1.02]">
          <img class="w-full h-48 object-cover" src="image/one.jpeg" alt="Project 1">
          <div class="p-4">
            <h3 class="font-bold text-slate-800 dark:text-white leading-tight">Landing Page AI</h3>
            <p class="text-xs text-slate-500 mt-1">Project personal branding pakai Bootstrap.</p>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-lg border border-slate-200 dark:border-slate-700 transition-transform hover:scale-[1.02]">
          <div class="flex justify-between items-start mb-4">
            <div class="p-3 bg-indigo-100 dark:bg-indigo-900/30 rounded-lg text-indigo-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m1-4h7m-7 20h7M5 20h3M3 4h7"></path></svg>
            </div>
            <span class="px-2 py-1 text-[10px] font-bold bg-green-100 text-green-700 rounded-full uppercase tracking-wider">Selesai</span>
          </div>
          <h3 class="font-bold text-slate-800 dark:text-white">Sistem Absensi Java</h3>
          <p class="text-xs text-slate-500 mt-2">Aplikasi desktop pakai Array Multi-dimensi.</p>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-lg border border-slate-200 dark:border-slate-700 transition-transform hover:scale-[1.02]">
          <div class="flex justify-between items-start mb-4">
            <div class="p-3 bg-orange-100 dark:bg-orange-900/30 rounded-lg text-orange-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            </div>
            <span class="px-2 py-1 text-[10px] font-bold bg-yellow-100 text-yellow-700 rounded-full uppercase tracking-wider">Proses</span>
          </div>
          <h3 class="font-bold text-slate-800 dark:text-white">Database Perpustakaan</h3>
          <p class="text-xs text-slate-500 mt-2">Belajar relasi tabel INNER JOIN & SQL.</p>
        </div>

      </div>
    </main>
  </div>

  <script>
    const htmlTag = document.getElementById('main-html');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') { htmlTag.classList.add('dark'); }

    function toggleTheme() {
      htmlTag.classList.toggle('dark');
      localStorage.setItem('theme', htmlTag.classList.contains('dark') ? 'dark' : 'light');
    }
  </script>
</body>
</html>
